services:
  postgres:
    image: postgres:16-alpine
    container_name: anti-fraud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anti_fraud_db
    ports:
      - "5433:5432"
    volumes:
      - anti_fraud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anti_fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: anti-fraud-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/anti_fraud_db"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm start"

volumes:
  anti_fraud_postgres_data: